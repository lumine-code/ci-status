name: Package specs

# Run the Jasmine suite of every lumine-code package at `master`, on every
# platform the editor ships for.
#
# This repository owns no packages; it reports on them. A red run here means a
# package regressed, never that this repository is broken — which is exactly
# why the sweep lives here rather than on the install catalog, whose commits it
# used to mark red for other repositories' bugs.
#
# The editor is built once per platform and handed to that platform's package jobs
# as an artifact. Building it per package would cost an hour of runner time for
# every ten packages; building it once per platform costs it three times.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to run, space- or comma-separated (globs allowed, e.g.
          "language-* linter"). Empty runs the whole fleet.
        required: false
        default: ""
      platforms:
        description: Platforms to run on, comma-separated.
        required: false
        default: ubuntu-latest,macos-latest,windows-latest
      editor-ref:
        description: The lumine-code/lumine ref to build the editor from.
        required: false
        default: master
      package-ref:
        description: The branch of each package to sweep.
        required: false
        default: master
  # Deliberately not scheduled here. `Stamp and sweep` owns the daily run: it
  # commits `last.log` first, and that push is what starts this sweep, so the
  # result lands on a commit of its own. Scheduling here as well would sweep
  # twice a day and put the second result on a commit the first had already
  # claimed — and worse, it would report nothing on that commit either way,
  # since GitHub keeps a suite raised by `schedule` out of the status rollup
  # the commit displays. Only the `push` above puts a result on a commit.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One line per spec instead of dots: with a hundred suites in one log, a hang
  # has to point at the spec it hung on.
  LUMINE_JASMINE_REPORTER: list

jobs:
  plan:
    name: Resolve the fleet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      packages: ${{ steps.plan.outputs.packages }}
      package-inputs: ${{ steps.plan.outputs.package-inputs }}
      platforms: ${{ steps.platforms.outputs.list }}
      unresolved: ${{ steps.plan.outputs.unresolved }}
      editor-sha: ${{ steps.editor.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test discovery retries
        run: node --test scripts/*.test.js
      # Pin the editor commit here, once, so all three platform builds and every
      # package job test the same editor. Resolving it per job would
      # let a push to the editor land mid-run and split the results.
      - name: Resolve the editor commit
        id: editor
        env:
          EDITOR_REF: ${{ inputs.editor-ref || 'master' }}
        run: |
          sha=$(git ls-remote https://github.com/lumine-code/lumine.git "$EDITOR_REF" | cut -f1)
          if [ -z "$sha" ]; then echo "No such editor ref: $EDITOR_REF" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Editor: lumine-code/lumine@$sha ($EDITOR_REF)" >> "$GITHUB_STEP_SUMMARY"
      - name: Select the platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'ubuntu-latest,macos-latest,windows-latest' }}
        run: |
          list=$(node -e '
            const allowed = new Set(["ubuntu-latest", "macos-latest", "windows-latest"]);
            const list = [...new Set(process.argv[1].split(",").map((value) => value.trim()).filter(Boolean))];
            const invalid = list.filter((value) => !allowed.has(value));
            if (list.length === 0 || invalid.length > 0) {
              console.error(`Platforms must be a non-empty subset of ${[...allowed].join(", ")}.`);
              process.exit(1);
            }
            console.log(JSON.stringify(list));
          ' "$PLATFORMS")
          echo "list=$list" >> "$GITHUB_OUTPUT"
      # Discovery reads the organization, so it needs a token for the repository
      # listing; the manifests and refs it reads afterwards cost no API quota.
      - name: Resolve every package in the organization
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.packages }}
          PACKAGE_REF: ${{ inputs.package-ref || 'master' }}
        run: |
          args=(--out plan.json --shards 1 --ref "$PACKAGE_REF" --editor-sha "${{ steps.editor.outputs.sha }}")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          node scripts/plan-specs.js "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: spec-plan
          path: plan.json
          retention-days: 7
      # Fail discovery visibly, but only after publishing the valid plan. Every
      # downstream job uses `!cancelled()`, so resolved packages still run.
      - name: Fail unresolved packages
        if: steps.plan.outputs.unresolved != '0'
        run: exit 1

  editor:
    name: Build the editor (${{ matrix.os }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          ref: ${{ needs.plan.outputs.editor-sha }}
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      # npm records the @lumine-code git forks with ssh URLs, but the runners
      # have no ssh key. Rewrite them to anonymous HTTPS (the forks are public).
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # Not `--ignore-scripts`: npm's allow-scripts gate already keeps everything
      # absent from the editor's `allowScripts` list skipped.
      # Preparing the git-hosted forks is flaky on Windows, so retry.
      - name: Install editor dependencies
        working-directory: lumine
        shell: bash
        run: |
          install() { npm ci; }
          install || install || install
      - name: Download the Electron binary
        working-directory: lumine
        run: node script/install-electron.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      # Bundle the plan with the editor so every package job needs one artifact
      # lookup, not a second simultaneous lookup for the same tiny plan. At fleet
      # scale those duplicate requests can be throttled by the artifact service.
      - uses: actions/download-artifact@v8
        with:
          name: spec-plan
      # An artifact stores neither symlinks nor an executable bit, and the tree
      # holds both — `node_modules/.bin` and the Electron binary — so pack it
      # ourselves. Everything here is relative to the workspace: a Windows
      # runner's `tar` is GNU tar under bash and would read `D:\…` as an
      # option-bearing path. zstd where the image has it (all three do today),
      # gzip as the portable fallback.
      #
      # Pipe through zstd explicitly rather than asking tar to drive it. The
      # three runners disagree about every spelling of that flag — macOS ships
      # bsdtar, where `-I` means `--files-from` and `--use-compress-program`
      # does not round-trip on extraction — and a pipe means the same thing to
      # all of them.
      - name: Pack the built editor
        shell: bash
        run: |
          set -o pipefail
          if command -v zstd >/dev/null 2>&1; then
            tar -cf - lumine plan.json | zstd -3 -T0 -o lumine-editor.tar.zst
          else
            tar -czf lumine-editor.tar.gz lumine plan.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: lumine-editor-${{ matrix.os }}
          path: lumine-editor.tar.*
          compression-level: 0
          retention-days: 1

  specs-linux:
    # A matrix may expand to at most 256 jobs, while the fleet across three
    # platforms is larger than that. Keep one matrix per platform: every leg is
    # one native check whose name and result identify the package directly.
    name: ${{ matrix.package }} (Linux)
    needs: [plan, editor]
    # `needs` cannot depend on one leg of a matrix, so a single platform whose
    # editor failed to build would otherwise skip every platform's specs. Run
    # anyway: package jobs whose editor exists report normally, and the ones
    # whose editor is missing fail on the download with the reason in plain sight.
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' && contains(fromJSON(needs.plan.outputs.platforms), 'ubuntu-latest') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        os: [ubuntu-latest]
    steps: &package-spec-steps
      - name: Enable Git symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      # This checkout goes first: `actions/checkout` cleans the workspace it
      # lands in, which would take the restored editor with it.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install headless-display dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: node scripts/install-headless-dependencies.js
      - name: Use HTTPS for GitHub git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: actions/download-artifact@v8
        with:
          name: lumine-editor-${{ matrix.os }}
      - name: Unpack the built editor
        shell: bash
        run: |
          set -o pipefail
          if [ -f lumine-editor.tar.zst ]; then
            zstd -dc lumine-editor.tar.zst | tar -xf -
          else
            tar -xzf lumine-editor.tar.gz
          fi
          rm -f lumine-editor.tar.*
      - name: Run ${{ matrix.package }} specs
        id: package_specs
        shell: bash
        run: node scripts/run-specs.js --plan plan.json --package "${{ matrix.package }}" --editor lumine
      - name: Retain an error receipt when setup or the runner did not finish
        if: always()
        shell: bash
        env:
          SPEC_PACKAGE: ${{ matrix.package }}
          SPEC_EXPECTED_SHA: ${{ fromJSON(needs.plan.outputs.package-inputs)[matrix.package].sha }}
          SPEC_EXPECTED_SOURCE: ${{ fromJSON(needs.plan.outputs.package-inputs)[matrix.package].source }}
          SPEC_EXPECTED_EDITOR_SHA: ${{ needs.plan.outputs.editor-sha }}
          SPEC_RUNNER_OUTCOME: ${{ steps.package_specs.outcome }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), os = require('node:os');
          const { spawnSync } = require('node:child_process');
          const crypto = require('node:crypto');
          function retainResult() {
            const name = process.env.SPEC_PACKAGE;
            const platform = process.env.RUNNER_OS || process.platform;
            const expectedSha = process.env.SPEC_EXPECTED_SHA || null;
            const expectedEditorSha = process.env.SPEC_EXPECTED_EDITOR_SHA || null;
            const source = process.env.SPEC_EXPECTED_SOURCE || null;
            const outcome = process.env.SPEC_RUNNER_OUTCOME || 'not-started';
            const output = path.join('results', `package-${platform.toLowerCase()}-${name}.json`);
            let existing = null;
            try { existing = JSON.parse(fs.readFileSync(output, 'utf8')); } catch {}
            const record = existing?.results?.length === 1 ? existing.results[0] : null;
            const validExpected = /^[a-f0-9]{40}$/i.test(expectedSha || '') &&
              /^[a-f0-9]{40}$/i.test(expectedEditorSha || '') &&
              typeof source === 'string' && source.length > 0;
            const identity = validExpected && existing && record && existing.package === name && existing.expectedEditorSha === expectedEditorSha &&
              record.name === name && record.source === source && record.expectedSha === expectedSha &&
              record.expectedEditorSha === expectedEditorSha;
            const initialInputs = existing?.editorSha === expectedEditorSha &&
              record?.sha === expectedSha && record.editorSha === expectedEditorSha;
            const passedInputs = record?.status === 'passed' && initialInputs &&
              record.shaAfter === expectedSha && record.editorShaAfter === expectedEditorSha;
            const skippedInputs = record?.status === 'skipped' && initialInputs &&
              record.shaAfter == null && record.editorShaAfter == null;
            if (identity && ['passed', 'failed', 'error'].includes(existing.status) &&
                (existing.status !== 'passed' || (outcome === 'success' && (passedInputs || skippedInputs)))) {
              if (existing.status !== 'passed') process.exitCode = 1;
              return;
            }
            function observedSha(directory) {
              if (!fs.existsSync(path.join(directory, '.git'))) return null;
              const result = spawnSync('git', ['rev-parse', '--verify', 'HEAD'], { cwd: directory, encoding: 'utf8' });
              const sha = String(result.stdout || '').trim();
              return result.status === 0 && /^[a-f0-9]{40}$/i.test(sha) ? sha : null;
            }
            const editorSha = observedSha(path.resolve('lumine'));
            const workspace = path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'lumine-specs');
            const sha = observedSha(path.join(workspace, 'checkout', name));
            let planSha256 = null;
            try { planSha256 = crypto.createHash('sha256').update(fs.readFileSync('plan.json')).digest('hex'); } catch {}
            const message = `Runner outcome: ${outcome}; no verified terminal result was retained.`;
            const fallback = fs.existsSync(output) ? output.replace(/\.json$/, '.setup-error.json') : output;
            const receipt = {
              schema: 2, package: name, platform, status: 'error', phase: 'setup-or-interrupted-runner',
              completedAt: new Date().toISOString(), expectedEditorSha, editorSha, planSha256,
              testExecution: 'not-attested', runnerOutcome: outcome, message,
              results: [{ name, source, platform, status: 'error', expectedSha, sha, expectedEditorSha, editorSha, message }]
            };
            fs.mkdirSync(path.dirname(fallback), { recursive: true });
            fs.writeFileSync(fallback, JSON.stringify(receipt, null, 2) + '\n', { flag: 'wx' });
            process.stderr.write(message + '\n');
            process.exitCode = 1;
          }
          retainResult();
          NODE
      - name: Upload the actual package and editor result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-result-${{ runner.os }}-${{ matrix.package }}
          path: results/package-*.json
          if-no-files-found: error
          retention-days: 7

  specs-macos:
    name: ${{ matrix.package }} (macOS)
    needs: [plan, editor]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' && contains(fromJSON(needs.plan.outputs.platforms), 'macos-latest') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        os: [macos-latest]
    steps: *package-spec-steps

  specs-windows:
    name: ${{ matrix.package }} (Windows)
    needs: [plan, editor]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' && contains(fromJSON(needs.plan.outputs.platforms), 'windows-latest') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
        os: [windows-latest]
    steps: *package-spec-steps
