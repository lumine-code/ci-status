name: Stamp and sweep

# Give each sweep a commit of its own, and let that commit's push start it.
#
# GitHub reports a repository's status as the aggregate of every check suite on
# its HEAD, not the newest one, so where HEAD never moves the status only
# ratchets: one red sweep pins the badge red however many green ones follow.
# Nothing in this repository changes between runs, so nothing would ever move
# HEAD on its own — hence stamping `last.log` before each sweep, so the sweep
# reports on a commit no other run has touched.
#
# The push carries `STAMP_TOKEN` rather than `GITHUB_TOKEN`, and that is the
# entire reason the secret exists. A `GITHUB_TOKEN` push deliberately triggers
# no workflow, and dispatching the sweep instead does not stand in for it:
# GitHub builds a commit's status rollup only from the suites a `push` raised
# and leaves out the ones raised by `workflow_dispatch` and `schedule`. A
# dispatched sweep is attached to the stamp commit in the Actions tab and
# invisible on the commit itself — so the stamp ends up carrying no status at
# all, which is the exact failure it was added to prevent.

on:
  schedule:
    # Daily. Each firing stamps a fresh commit and sweeps it, so the badge is
    # never more than a day behind the fleet.
    - cron: "0 3 * * *"
  workflow_dispatch:

# The stamp pushes with `STAMP_TOKEN`, which carries its own write scope, so
# the job's own token needs nothing beyond reading the checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stamp:
    name: Stamp last.log
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fail here rather than at the push. Absent the secret, `checkout` falls
      # back to `GITHUB_TOKEN`, the push succeeds, and the sweep silently never
      # runs — a green job that did nothing, reported as a healthy fleet.
      - name: Require the stamp token
        env:
          STAMP_TOKEN: ${{ secrets.STAMP_TOKEN }}
        run: |
          if [ -z "$STAMP_TOKEN" ]; then
            echo "STAMP_TOKEN is unset. The stamp push needs a token other than GITHUB_TOKEN, or it starts no sweep." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # `persist-credentials` is on by default, so this is what `stamp.js`
          # pushes with.
          token: ${{ secrets.STAMP_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Stamp and commit
        id: stamp
        run: node scripts/stamp.js
      - name: Name the swept commit
        if: steps.stamp.outputs.sha != ''
        run: |
          echo "Swept commit: ${{ steps.stamp.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
